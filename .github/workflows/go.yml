name: Go

on:
  push:
    branches: [ base ]
  pull_request:
    branches: [ base ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.4.0

    - name: Set up Go
      uses: actions/setup-go@v5.6.0
      with:
        go-version: 1.18.10

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
      
